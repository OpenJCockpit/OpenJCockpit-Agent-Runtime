name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Report Maven version
        run: mvn -v

      - name: Build, test, and verify JaCoCo coverage gate
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload test and coverage reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shellcheck image scripts
        run: docker run --rm -v "$PWD:/w:ro" -w /w koalaman/shellcheck:v0.10.0 -S warning docker/*.sh

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build --tag openjcockpit/embabel-agent-runtime:ci .

      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id openjcockpit/embabel-agent-runtime:ci -u)"
          [ "$uid" != 0 ] || { echo "::error::embabel-agent-runtime runs as root"; exit 1; }

  gate:
    name: ci-summary
    needs: [verify, scripts, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI leg results
        env:
          RESULTS: "verify=${{ needs.verify.result }} scripts=${{ needs.scripts.result }} image=${{ needs.image.result }}"
        run: |
          set -euo pipefail
          echo "$RESULTS"
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success) ;;
              *) echo "::error::CI leg ${entry%%=*} concluded '${entry#*=}'"; exit 1 ;;
            esac
          done
