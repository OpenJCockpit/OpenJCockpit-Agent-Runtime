name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      NAME: embabel-agent-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse anything but an immutable version tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }

      - name: Registry
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$owner" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$owner/$NAME:$TAG" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$TAG" \
            --tag "$IMAGE" .

      - name: Non-root user
        run: |
          uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
          [ "$uid" != 0 ] || { echo "::error::$NAME runs as root"; exit 1; }

      - name: Vulnerability scan (blocks on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"

      - name: Refuse to overwrite an existing release
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists; release tags are immutable"; exit 1
          fi

      - name: Push
        run: |
          docker push "$IMAGE"
          echo "### $NAME: \`$IMAGE@$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the image is publicly pullable
        run: |
          repo="$OWNER/$NAME"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token // empty' || true)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token:-none}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repo/manifests/$TAG")"
          if [ "$status" = 200 ]; then
            echo "Public: \`docker pull $IMAGE\` works without login" >> "$GITHUB_STEP_SUMMARY"
          else
            msg="$IMAGE is not publicly pullable (HTTP $status). Set the package to Public once: https://github.com/orgs/$OWNER/packages/container/$NAME/settings"
            echo "::warning::$msg"
            echo ":warning: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
