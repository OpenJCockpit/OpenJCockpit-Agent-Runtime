name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      NAME: embabel-agent-runtime
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse anything but an immutable version tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }

      - name: Registry
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$owner" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$owner/$NAME:$TAG" >> "$GITHUB_ENV"
          echo "LABELS=--label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY --label org.opencontainers.image.revision=$GITHUB_SHA --label org.opencontainers.image.version=$TAG" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: |
          for platform in ${PLATFORMS//,/ }; do
            docker buildx build --platform "$platform" $LABELS --tag "$NAME:${platform##*/}" --load .
          done

      - name: Non-root user
        run: |
          for platform in ${PLATFORMS//,/ }; do
            uid="$(docker run --rm --platform "$platform" --entrypoint id "$NAME:${platform##*/}" -u)"
            [ "$uid" != 0 ] || { echo "::error::$NAME ($platform) runs as root"; exit 1; }
          done

      - name: Vulnerability scan (blocks on fixable CRITICAL)
        run: |
          for platform in ${PLATFORMS//,/ }; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
              image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$NAME:${platform##*/}"
          done

      - name: Refuse to overwrite an existing release
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists; release tags are immutable"; exit 1
          fi

      - name: Push
        run: |
          docker buildx build --platform "$PLATFORMS" $LABELS --tag "$IMAGE" \
            --metadata-file "$RUNNER_TEMP/metadata.json" --push .
          echo "### $NAME: \`$IMAGE@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")\` ($PLATFORMS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every platform is published
        run: |
          published="$(docker buildx imagetools inspect --raw "$IMAGE" | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')"
          for platform in ${PLATFORMS//,/ }; do
            grep -qx "$platform" <<<"$published" || { echo "::error::$IMAGE has no $platform manifest"; exit 1; }
          done

      - name: Verify the image is publicly pullable
        run: |
          repo="$OWNER/$NAME"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token // empty' || true)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token:-none}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repo/manifests/$TAG")"
          if [ "$status" = 200 ]; then
            echo "Public: \`docker pull $IMAGE\` works without login" >> "$GITHUB_STEP_SUMMARY"
          else
            msg="$IMAGE is not publicly pullable (HTTP $status). Set the package to Public once: https://github.com/orgs/$OWNER/packages/container/$NAME/settings"
            echo "::warning::$msg"
            echo ":warning: $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
