spring:
  web:
    error:
      include-message: always
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: test
    mcp:
      client:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/openjcockpit/protocol/openid-connect/certs
openjcockpit:
  # mirrors the main application.yml, which this file shadows (the profile files refer to it)
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:openjcockpit}
    client-id: ${KEYCLOAK_CLIENT_ID:${AGENT_RUNTIME_CLIENT_ID:openjcockpit-agent-runtime}}
    realm-url: ${openjcockpit.keycloak.url}/realms/${openjcockpit.keycloak.realm}
  security:
    keycloak:
      enabled: ${ENABLE_KEYCLOAK:true}
    jwt-issuer: http://localhost:8080/realms/openjcockpit
  # tests opt in to configuration-driven agents explicitly
  agent-definitions:
    enabled: false
    # mirrors the main application.yml, which this file shadows
    local-root: ${AGENT_DEFINITIONS_LOCAL_ROOT:/agent-definitions}
embabel:
  agent-platform:
    scanning:
      auto: false
  models:
    default-llm: test-llm
    default-embedding-model: test
    embedding-services:
      best: test
      cheapest: test
    llms:
      best: test-llm
      cheapest: test-llm
